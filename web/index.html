<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Serbolin — персональная RPG-система трекинга жизни.">
  <meta name="theme-color" content="#0D0D0D">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Serbolin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Serbolin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0D0D0D;
      color: #F0F0F0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100%;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 1;
    }
    #loading .title {
      color: #C9A84C;
      font-size: 28px;
      letter-spacing: 6px;
      font-weight: 700;
    }
    #loading .sub {
      color: #888;
      font-size: 12px;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="title">SERBOLIN</div>
    <div class="sub">LOADING SYSTEM…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
