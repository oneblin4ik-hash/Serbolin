name: serbolin
description: "Serbolin — персональная RPG-система трекинга жизни."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  fl_chart: ^0.66.2
  lottie: ^3.1.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  table_calendar: ^3.0.9
  provider: ^6.1.2
  uuid: ^4.3.3
  confetti: ^0.7.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/avatar/
    - assets/audio/
