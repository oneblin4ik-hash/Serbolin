name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - claude/flutter-web-serbolin-app-0Bk0V
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - run: flutter pub get

      - run: flutter build web --release --base-href=/serbolin/

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
          clean: true
